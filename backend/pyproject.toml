[project]
name = "familiar"
version = "0.1.0"
description = "Conversational MtG Commander deckbuilding assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # Moxfield's API sits behind Cloudflare and TLS-fingerprints plain httpx
    # (returns 403); curl_cffi impersonates a real browser's TLS handshake so
    # the Moxfield provider can reach it. See app/integrations/moxfield.py.
    "curl_cffi>=0.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "openai>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness and pyflakes only. Line length is not enforced: the codebase
# carries long rationale comments on purpose.
select = ["E", "F", "W"]
ignore = ["E501"]
